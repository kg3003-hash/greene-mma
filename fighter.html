<style>
  :root{--black:#0C0E0A;--black-2:#13160F;--volt:#C9F73A;--bone:#F2F0E9;--steel:#9AA194;--red:#FF4B3E;--hair:rgba(242,240,233,.14);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--black);color:var(--bone);font-family:'Barlow',sans-serif;font-size:17.5px;line-height:1.65;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1060px;margin:0 auto;padding:0 22px;}
  nav{position:sticky;top:0;z-index:50;background:rgba(12,14,10,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--hair);}
  nav .wrap{display:flex;align-items:center;justify-content:center;height:58px;}
  nav .links{display:flex;gap:38px;font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);}
  nav .links a{position:relative;padding:4px 0;}
  nav .links a::after{content:'';position:absolute;left:50%;right:50%;bottom:-2px;height:2px;background:var(--volt);transition:left .2s,right .2s;}
  nav .links a:hover,nav .links a.on{color:var(--volt);}
  nav .links a:hover::after,nav .links a.on::after{left:0;right:0;}
  @media(max-width:700px){nav .links{gap:18px;font-size:12px;letter-spacing:.06em;}}
  .hero{padding:70px 0 52px;border-bottom:1px solid var(--hair);position:relative;overflow:hidden;
        background:radial-gradient(ellipse 80% 60% at 22% 0%, rgba(201,247,58,.07), transparent 62%);}
  .hero .bigmark{position:absolute;right:-80px;top:50%;transform:translateY(-50%);width:min(400px,48vw);opacity:.055;pointer-events:none;}
  .hero .bigmark path{stroke-dasharray:320;stroke-dashoffset:320;animation:draw 1.8s cubic-bezier(.65,0,.35,1) .2s forwards;}
  @keyframes draw{to{stroke-dashoffset:0;}}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--volt);font-weight:700;display:flex;align-items:center;gap:14px;margin-bottom:20px;opacity:0;animation:rise .5s ease .15s forwards;}
  .eyebrow::after{content:'';width:70px;height:1px;background:var(--hair);}
  h1{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(40px,8vw,84px);line-height:.96;opacity:0;transform:translateY(18px);animation:rise .7s cubic-bezier(.2,.7,.3,1) .3s forwards;}
  h1 span{color:var(--volt);}
  .dek{margin-top:20px;max-width:620px;font-size:18.5px;opacity:0;transform:translateY(14px);animation:rise .6s cubic-bezier(.2,.7,.3,1) .5s forwards;}
  @keyframes rise{to{opacity:1;transform:none;}}
  section{padding:56px 0;border-bottom:1px solid var(--hair);}
  .sechead{display:flex;align-items:baseline;gap:16px;margin-bottom:28px;flex-wrap:wrap;}
  .sechead .sicon{width:20px;height:20px;align-self:center;}
  .sechead h2{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(24px,4vw,34px);line-height:1;}
  .sechead .mono-tag{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);}
  .empty{border:1px dashed var(--hair);padding:52px 26px;text-align:center;color:var(--steel);font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;line-height:2;}
  .reveal{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s ease;}
  .reveal.in{opacity:1;transform:none;}
  footer{padding:46px 0 66px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel);line-height:2.1;}
  footer a{color:var(--bone);} footer a:hover{color:var(--volt);}
  /* ad slots — reserved space so nothing jumps when they load */
  .adwrap{margin:44px 0;text-align:center;}
  .adwrap .lbl{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--steel);opacity:.55;margin-bottom:8px;}
  .adwrap ins{display:block;min-height:100px;}
  .adwrap:empty{display:none;}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}.eyebrow,h1,.dek{opacity:1;transform:none;}.hero .bigmark path{stroke-dashoffset:0;}.reveal{opacity:1;transform:none;}}
  .hero.fighter{padding:64px 0 44px;}
  .tapewrap{border:1px solid var(--hair);background:var(--black-2);margin-top:8px;}
  .tapewrap .r{display:grid;grid-template-columns:1fr auto;gap:16px;padding:16px 24px;align-items:center;}
  .tapewrap .r+.r{border-top:1px solid var(--hair);}
  .tapewrap .l{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);}
  .tapewrap .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:22px;color:var(--volt);text-align:right;}
  .statusrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
  .pill{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:7px 13px;border:1px solid var(--hair);color:var(--steel);}
  .pill.on{background:var(--volt);border-color:var(--volt);color:var(--black);font-weight:700;}
  .nextbox{border:1px solid var(--hair);border-left:3px solid var(--volt);background:var(--black-2);padding:24px;margin-top:8px;}
  .nextbox .k{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--volt);font-weight:700;}
  .nextbox .b{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:24px;margin-top:8px;line-height:1.15;}
  .back{display:inline-block;margin-top:30px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);}
  .back:hover{color:var(--volt);}
  .feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  a.card{border:1px solid var(--hair);padding:26px;display:flex;flex-direction:column;gap:12px;background:var(--black-2);transition:border-color .18s,transform .18s;}
  a.card:hover{border-color:rgba(201,247,58,.55);transform:translateY(-3px);}
  a.card .c{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--volt);font-weight:700;}
  a.card h3{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:22px;line-height:1.12;}
  a.card p{font-size:15.5px;color:var(--steel);}
  a.card .t{margin-top:auto;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);opacity:.8;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px;}
  .fbtn{padding:9px 16px;border:1px solid var(--hair);background:var(--black-2);cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);}
  .fbtn:hover{border-color:var(--volt);color:var(--volt);}
  .fbtn.on{background:var(--volt);border-color:var(--volt);color:var(--black);font-weight:700;}
  #more{display:block;margin:30px auto 0;padding:14px 32px;background:transparent;border:2px solid var(--volt);color:var(--volt);cursor:pointer;font-family:'Barlow',sans-serif;font-weight:700;font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;}
  #more:hover{background:var(--volt);color:var(--black);}
  .picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;}
  .pick{border:1px solid var(--hair);border-top:3px solid var(--volt);background:var(--black-2);padding:28px;transition:border-color .18s,transform .18s;}
  .pick:hover{border-color:rgba(201,247,58,.5);transform:translateY(-3px);}
  .pick .odds{font-family:'JetBrains Mono',monospace;font-size:38px;font-weight:700;color:var(--volt);line-height:1;}
  .pick .fighter{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:24px;margin-top:10px;line-height:1.08;}
  .pick p{font-size:16.5px;color:var(--steel);margin-top:14px;}
  .pick .conf{margin-top:18px;padding-top:14px;border-top:1px solid var(--hair);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);}
  .pick .conf b{color:var(--bone);font-weight:700;}
  .note{margin-top:26px;font-size:15px;color:var(--steel);max-width:640px;}
  .bout{border:1px solid var(--hair);background:var(--black-2);margin-bottom:12px;transition:border-color .18s,transform .18s;}
  .bout:hover{border-color:rgba(201,247,58,.5);transform:translateY(-2px);}
  .bout .top{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;border-bottom:1px solid var(--hair);
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);}
  .bout .top .when{color:var(--volt);font-weight:700;}
  .bout .body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:22px;}
  .bout .f{text-align:center;}
  .bout .f .n{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(19px,2.6vw,26px);line-height:1.06;}
  .bout .f .o{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:22px;margin-top:8px;}
  .bout .f.dog .o{color:var(--volt);}
  .bout .f.fav .o{color:var(--steel);}
  .bout .f .tag{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);margin-top:6px;}
  .bout .vs{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--steel);}
  .headliner{border-top:3px solid var(--volt);}
  .headliner .top{background:rgba(201,247,58,.06);}
  .updated{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);margin-top:20px;}
</style>

<script>
(function(){
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting){
        var sib=e.target.parentElement ? e.target.parentElement.querySelectorAll('.reveal') : [];
        var i=Array.prototype.indexOf.call(sib,e.target);
        e.target.style.transitionDelay=(Math.max(i,0)*60)+'ms';
        e.target.classList.add('in'); io.unobserve(e.target);
      }
    });
  },{threshold:.08}) : null;

  // Callable any time — after Firestore injects new markup, call window.__reveal()
  window.__reveal=function(){
    var els=document.querySelectorAll('.reveal:not(.in)');
    if(reduced || !io){ els.forEach(function(el){el.classList.add('in');}); return; }
    els.forEach(function(el){
      io.observe(el);
      // safety net: if it is already on screen, show it immediately
      var r=el.getBoundingClientRect();
      if(r.top < window.innerHeight && r.bottom > 0) el.classList.add('in');
    });
  };
  window.__reveal();
  // catch anything injected without an explicit call
  if(window.MutationObserver){
    new MutationObserver(function(){ window.__reveal(); })
      .observe(document.body,{childList:true,subtree:true});
  }
  setTimeout(function(){ window.__reveal(); }, 1200);
})();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCN2eOBaQBiZDOexipJ-KS7pqkOaNJq7gU",
  authDomain: "bragging-rights-public.firebaseapp.com",
  projectId: "bragging-rights-public",
  storageBucket: "bragging-rights-public.firebasestorage.app",
  messagingSenderId: "525120309709",
  appId: "1:525120309709:web:a21f060511e84bb4a91c84"
};
const esc=s=>{const d=document.createElement("div");d.textContent=s||"";return d.innerHTML;};
const MARK=`<svg viewBox="0 0 120 120"><path d="M104.35,41.63 78.37,15.65 41.63,15.65 15.65,41.63 15.65,78.37 41.63,104.35 78.37,104.35 104.35,78.37 104.35,64 71,64" fill="none" stroke="#C9F73A" stroke-width="11" stroke-linejoin="miter"/></svg>`;
const want=new URLSearchParams(location.search).get("f");
const app=document.getElementById("app");
const slugOf=f=>((f.first||'')+'-'+(f.last||'')).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

try{
  const db=getFirestore(initializeApp(firebaseConfig));
  const snap=await getDoc(doc(db,"site","fighters"));
  const all=((snap.data()||{}).fighters)||[];
  const f=all.find(x=>(x.slug||slugOf(x))===want);
  if(!f) throw new Error("not found");

  document.title=((f.first||'')+' '+(f.last||'')).trim()+" — Greene MMA";

  const rows=[["Record",f.record],["Weight class",f.weight],["Gym",f.gym],
              ["City",f.city],["Level",f.pro===false?"Amateur":"Pro"],["Status",f.status]]
             .filter(r=>r[1]);

  app.innerHTML=
    '<header class="hero fighter">'+MARK.replace('<svg','<svg class="bigmark" aria-hidden="true"')+
      '<div class="wrap">'+
        '<div class="eyebrow">Utah roster</div>'+
        (f.nickname?'<div style="font-family:\'JetBrains Mono\',monospace;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);margin-bottom:8px;">"'+esc(f.nickname)+'"</div>':'')+
        '<h1>'+esc(f.first)+' <span>'+esc(f.last)+'</span></h1>'+
        '<div class="statusrow">'+
          (f.status?'<span class="pill on">'+esc(f.status)+'</span>':'')+
          '<span class="pill">'+(f.pro===false?'Amateur':'Pro')+'</span>'+
          (f.weight?'<span class="pill">'+esc(f.weight)+'</span>':'')+
        '</div>'+
      '</div>'+
    '</header>'+
    (f.next?'<section><div class="wrap"><div class="sechead">'+
      MARK.replace('<svg','<svg class="sicon" aria-hidden="true"')+
      '<h2>Next Fight</h2></div>'+
      '<div class="nextbox"><div class="k">Booked</div><div class="b">'+esc(f.next)+'</div></div>'+
    '</div></section>':'')+
    '<section><div class="wrap"><div class="sechead">'+
      MARK.replace('<svg','<svg class="sicon" aria-hidden="true"')+
      '<h2>Tale of the Tape</h2></div>'+
      '<div class="tapewrap">'+rows.map(r=>
        '<div class="r"><div class="l">'+esc(r[0])+'</div><div class="v">'+esc(r[1])+'</div></div>').join('')+
      '</div>'+
      (f.note?'<p style="margin-top:22px;color:var(--steel);font-size:16.5px;max-width:640px;">'+esc(f.note)+'</p>':'')+
      '<a class="back" href="/fighters.html">\u2190 Full roster</a>'+
    '</div></section>';
}catch(e){
  app.innerHTML='<div class="wrap" style="padding:80px 22px;"><div class="empty">Fighter not found.<br><br>'+
    '<a class="back" href="/fighters.html">\u2190 Full roster</a></div></div>';
  console.warn(e);
}
if(window.__reveal) window.__reveal();
</script>
