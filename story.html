<script>
(function(){
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting){
        var sib=e.target.parentElement ? e.target.parentElement.querySelectorAll('.reveal') : [];
        var i=Array.prototype.indexOf.call(sib,e.target);
        e.target.style.transitionDelay=(Math.max(i,0)*60)+'ms';
        e.target.classList.add('in'); io.unobserve(e.target);
      }
    });
  },{threshold:.08}) : null;

  // Callable any time — after Firestore injects new markup, call window.__reveal()
  window.__reveal=function(){
    var els=document.querySelectorAll('.reveal:not(.in)');
    if(reduced || !io){ els.forEach(function(el){el.classList.add('in');}); return; }
    els.forEach(function(el){
      io.observe(el);
      // safety net: if it is already on screen, show it immediately
      var r=el.getBoundingClientRect();
      if(r.top < window.innerHeight && r.bottom > 0) el.classList.add('in');
    });
  };
  window.__reveal();
  // catch anything injected without an explicit call
  if(window.MutationObserver){
    new MutationObserver(function(){ window.__reveal(); })
      .observe(document.body,{childList:true,subtree:true});
  }
  setTimeout(function(){ window.__reveal(); }, 1200);
})();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, getDoc, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// SAME CONFIG AS index.html
const firebaseConfig = {
  apiKey: "AIzaSyCN2eOBaQBiZDOexipJ-KS7pqkOaNJq7gU",
  authDomain: "bragging-rights-public.firebaseapp.com",
  projectId: "bragging-rights-public",
  storageBucket: "bragging-rights-public.firebasestorage.app",
  messagingSenderId: "525120309709",
  appId: "1:525120309709:web:a21f060511e84bb4a91c84"
};

const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function timeAgo(d){
  const s=(Date.now()-d.getTime())/1000;
  if(s<90) return "Now";
  const m=Math.floor(s/60); if(m<60) return m+"m ago";
  const h=Math.floor(m/60); if(h<24) return h+"h ago";
  return Math.floor(h/24)+"d ago";
}

const id=new URLSearchParams(location.search).get("id");
const app=document.getElementById("app");

try{
  if(!id) throw new Error("No story id");
  if(firebaseConfig.projectId==="PASTE_ME") throw new Error("Firebase config not set");
  const fb=initializeApp(firebaseConfig);
  const db=getFirestore(fb);

  const snap=await getDoc(doc(db,"stories",id));
  if(!snap.exists()) throw new Error("Story not found");
  const s=snap.data();

  document.title=s.headline+" — Greene MMA";
  const live=/live/i.test(s.category)?" live":"";

  // Related stories
  const rel=await getDocs(query(collection(db,"stories"),orderBy("publishedAt","desc"),limit(7)));
  const others=rel.docs.filter(d=>d.id!==id).slice(0,3)
    .map(d=>({id:d.id,...d.data()}));

  const paras = window.gmFormat ? window.gmFormat(s.body||"") : "";

  app.innerHTML=
    '<header class="hero"><div class="wrap reveal">'+
      '<span class="cat'+live+'">'+esc(s.category)+'</span>'+
      '<h1>'+esc(s.headline)+'</h1>'+
      '<div class="meta"><span>'+(s.publishedAt&&s.publishedAt.toDate?timeAgo(s.publishedAt.toDate()):'')+'</span>'+
        (s.original && s.author ? '<span>by '+esc(s.author)+'</span>' : '<span>via '+esc(s.sourceName)+'</span>')+
      '</div>'+
    '</div></header>'+
    '<div class="wrap"><div class="rule"></div>'+
      '<div class="body reveal">'+(s.original&&paras?paras:esc(s.summary))+'</div>'+
      (s.original
        ? '<div class="src reveal"><div class="lbl">Written by</div><div class="name">'+esc(s.author||'Greene MMA')+'</div>'+
          '<p>From the Greene corner. If we got something wrong, tell us.</p></div>'
        : '<div class="src reveal">'+
          '<div class="lbl">Original reporting</div>'+
          '<div class="name">'+esc(s.sourceName)+'</div>'+
          '<p>Our take is above. The full reporting lives with the people who did it — go read it there.</p>'+
          '<a class="go" href="'+esc(s.sourceUrl)+'" target="_blank" rel="noopener">Read the full story →</a>'+
          '</div>')+
    '</div>'+
    '<div class="wrap"><div class="adwrap">      <div class="lbl">Advertisement</div>      <!-- <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="0000000000" data-ad-format="auto" data-full-width-responsive="true"></ins>      <scr'+'ipt>(adsbygoogle = window.adsbygoogle || []).push({});<\/scr'+'ipt> -->    </div></div>'+
    (others.length?
    '<div class="more"><div class="wrap wide">'+
      '<h2>More from the corner</h2>'+
      '<div class="feed">'+others.map(o=>
        '<a class="card" href="/s/'+encodeURIComponent(o.id)+'">'+
          '<span class="c">'+esc(o.category)+'</span>'+
          '<h3>'+esc(o.headline)+'</h3>'+
          '<p>'+esc(o.summary)+'</p>'+
        '</a>').join("")+
      '</div><a class="back" href="/">← All news</a>'+
    '</div></div>':'');

}catch(err){
  app.innerHTML='<div class="wrap"><div class="loading">Story not found.<br><br>'+
    '<a class="back" href="/">← Back to the news</a></div></div>';
  console.warn(err);
}
if(window.__reveal) window.__reveal();
</script>
<script>
/* ---------- Greene MMA text formatting ----------
   Simple, safe markup. Everything is HTML-escaped first, so nothing a writer
   types can inject markup — only the patterns below become formatting.

     ## Heading          ### Smaller heading
     **bold**            *italic*            __underline__
     > quote
     - bullet            1. numbered
     [link text](https://example.com)
     ---                 horizontal rule
*/
window.gmFormat=function(src){
  const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline=t=>{
    t=t.replace(/\[([^\]]{1,120})\]\((https?:\/\/[^\s)]{1,300})\)/g,
      (m,txt,url)=>'<a href="'+url.replace(/"/g,'%22')+'" target="_blank" rel="noopener">'+txt.replace(/"/g,'&quot;')+'</a>');
    t=t.replace(/\*\*([^*]{1,300})\*\*/g,'<strong>$1</strong>');
    t=t.replace(/__([^_]{1,300})__/g,'<u>$1</u>');
    t=t.replace(/(^|[^*])\*([^*\n]{1,300})\*/g,'$1<em>$2</em>');
    return t;
  };
  const lines=esc(String(src||'')).split(/\r?\n/);
  let out=[], list=null, para=[];
  const flushPara=()=>{ if(para.length){ out.push('<p>'+inline(para.join(' '))+'</p>'); para=[]; } };
  const flushList=()=>{ if(list){ out.push('</'+list+'>'); list=null; } };
  for(const raw of lines){
    const line=raw.trim();
    if(!line){ flushPara(); flushList(); continue; }
    let m;
    if(/^---+$/.test(line)){ flushPara(); flushList(); out.push('<hr>'); continue; }
    if((m=line.match(/^###\s+(.*)$/))){ flushPara(); flushList(); out.push('<h3>'+inline(m[1])+'</h3>'); continue; }
    if((m=line.match(/^##\s+(.*)$/))){ flushPara(); flushList(); out.push('<h2>'+inline(m[1])+'</h2>'); continue; }
    if((m=line.match(/^&gt;\s?(.*)$/))){ flushPara(); flushList(); out.push('<blockquote>'+inline(m[1])+'</blockquote>'); continue; }
    if((m=line.match(/^[-*]\s+(.*)$/))){
      flushPara();
      if(list!=='ul'){ flushList(); out.push('<ul>'); list='ul'; }
      out.push('<li>'+inline(m[1])+'</li>'); continue;
    }
    if((m=line.match(/^\d+[.)]\s+(.*)$/))){
      flushPara();
      if(list!=='ol'){ flushList(); out.push('<ol>'); list='ol'; }
      out.push('<li>'+inline(m[1])+'</li>'); continue;
    }
    flushList();
    para.push(line);
  }
  flushPara(); flushList();
  return out.join('\n');
};

</script>
<script>
/* Reading progress */
(function(){
  var bar=document.getElementById('progress');
  if(!bar) return;
  var ticking=false;
  function update(){
    var h=document.documentElement;
    var max=h.scrollHeight-h.clientHeight;
    bar.style.width=(max>0?(h.scrollTop/max*100):0)+'%';
    ticking=false;
  }
  addEventListener('scroll',function(){ if(!ticking){ ticking=true; requestAnimationFrame(update); } },{passive:true});
  update();
})();
</script>
